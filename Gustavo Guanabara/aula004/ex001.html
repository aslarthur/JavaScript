<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            body{
                background-color: rgb(105, 105, 173);
                color: white;
                font: normal 20pt Arial;
            }
            h1{
                color: rgb(225, 212, 22)
            }
        </style>
        <title>Meu primeiro programa...</title>
    </head>
    <body>
        <h1>Olá, mundo!</h1>
        <p>Já me livrei da maldição</p>
        <script>
            /*window.alert: A janela alerta, mostra*/
            window.alert("Minha primeira mensagem");


            /*window.confirm: A janela pede a confirmação de algo*/ 
            window.confirm("Está gostando de javascript? ");


            /*window.prompt: prompt é como se fosse um input em python, então a janela pede uma entrada*/
            window.prompt("Digite seu nome? ");
        </script>
    </body>
</html>
